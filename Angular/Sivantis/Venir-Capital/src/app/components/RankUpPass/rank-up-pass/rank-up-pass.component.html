<body>
    <app-header></app-header>
    <app-home-sidebar></app-home-sidebar>
    <div class="loading-screen" *ngIf="loading">
        <div class="loader"></div>
        <p>Loading...</p>
    </div>
    <div class="alert-Container">
        <ngb-alert
        *ngFor="let alert of alertService.alerts" class="alert" [type]="alert.type" [dismissible]="false" >
        {{ alert.message }}
      </ngb-alert>
    </div>
    <div class="channelInfo-Container">
        <button (click)="archonPass()">Archon Pass</button>
        <button (click)="masterPass()">Master Pass</button>
        <button (click)="connectWallet()">Connect Wallet</button>
    </div>
    
</body>

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'Project_Noir'
version = 'Im-Back-SNAPSHOT'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}


repositories {
	mavenCentral()
	google()
}

jar {
	// Specify the main class for your JAR (if applicable)
	manifest {
		attributes 'Main-Class': 'com.example.AthenaApplication'
	}
}



dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb:3.4.4'
	implementation 'org.springframework.boot:spring-boot-starter-mail:3.4.4'
	implementation 'org.springframework.boot:spring-boot-starter-security:3.4.4'
	implementation 'org.springframework.boot:spring-boot-starter-validation:3.4.4'
	implementation 'org.springframework.boot:spring-boot-starter-web:3.4.4'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf:3.4.4'
	implementation 'org.springframework.boot:spring-boot-starter-websocket:3.4.4'
	developmentOnly 'org.springframework.boot:spring-boot-devtools:3.4.4'
	testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.4'
	testImplementation 'org.springframework.security:spring-security-test:6.4.0'
	implementation 'net.javacrumbs.shedlock:shedlock-spring:6.3.1'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-mongo:6.3.1'
	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'
	implementation 'dev.samstevens.totp:totp:1.7.1'
	implementation 'org.apache.tomcat:tomcat-jdbc:11.0.6'
	implementation 'com.auth0:java-jwt:4.5.0'
	implementation 'com.google.api-client:google-api-client:2.4.1'
	implementation 'com.google.api-client:google-api-client-java6:2.1.4'
	implementation 'com.google.apis:google-api-services-youtube:v3-rev20230123-2.0.0'
	implementation 'com.google.oauth-client:google-oauth-client-jetty:1.36.0'
	implementation 'org.web3j:core:5.0.0'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.17.0'
	implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.0'
	implementation 'software.amazon.awssdk:secretsmanager:2.25.10'
	implementation 'software.amazon.awssdk:regions:2.25.10'
	implementation 'software.amazon.awssdk:ec2:2.27.22'
}


tasks.named('test') {
	useJUnitPlatform()
}
